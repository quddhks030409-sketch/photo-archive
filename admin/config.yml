# 사진 관리자 페이지 설정 (Decap CMS)
# 배포 전에 아래 repo 를 본인 GitHub 저장소 이름으로 바꿔 주세요. 예: kangbyeongwan/photo-archive
backend:
  name: github
  repo: quddhks030409-sketch/photo-archive
  branch: main
  commit_messages:
    create: "추가: {{slug}}"
    update: "수정: {{slug}}"
    delete: "삭제: {{slug}}"
    uploadMedia: "사진 업로드: {{path}}"
    deleteMedia: "사진 삭제: {{path}}"

locale: ko
media_folder: images/uploads
public_folder: /images/uploads
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: series
    label: 시리즈
    label_singular: 시리즈
    description: 사진 시리즈(프로젝트)를 만들고 사진을 올리거나 지울 수 있어요. 변경 사항은 저장 후 1분 정도 뒤에 사이트에 반영돼요.
    folder: content/series
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: title_en
    slug: "{{slug}}"
    summary: "{{title_ko}} / {{title_en}} — {{year}}"
    sortable_fields: [date, title_en]
    fields:
      - { label: "제목 (한국어)", name: title_ko, widget: string }
      - { label: "제목 (영어) — 주소에도 쓰여요", name: title_en, widget: string }
      - { label: "장소 (한국어)", name: location_ko, widget: string, required: false }
      - { label: "장소 (영어)", name: location_en, widget: string, required: false }
      - { label: "연도", name: year, widget: string, required: false }
      - { label: "정렬 기준 날짜 (최신이 위로)", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "대표 사진 (비우면 첫 번째 사진)", name: cover, widget: image, required: false }
      - { label: "설명 (한국어)", name: description_ko, widget: text, required: false }
      - { label: "설명 (영어)", name: description_en, widget: text, required: false }
      - { label: "사진 배치 방식", name: layout, widget: select, default: "stack", required: false, hint: "시리즈 전체에 쓰여요. 소주제마다 따로 고를 수도 있어요.", options: [{ label: "세로로 크게 쌓기 (기본)", value: "stack" }, { label: "대표 컷 크게 + 아래 가로로 넘기기", value: "feature" }, { label: "사진 왼쪽 · 설명 오른쪽", value: "side-left" }, { label: "사진 오른쪽 · 설명 왼쪽", value: "side-right" }, { label: "사진 좌우 번갈아 · 옆에 설명", value: "alternate" }, { label: "옆으로 넘겨 보기 (가로로 끌기)", value: "scroll" }, { label: "격자로 모아 보기", value: "grid" }] }
      - label: "소주제 (시리즈 안을 나누고 싶을 때)"
        name: chapters
        widget: list
        required: false
        allow_reorder: true
        collapsed: true
        label_singular: 소주제
        summary: "{{fields.title_ko}}"
        hint: "예: 손의 이력 안에 '분식집, 31년', '어머니, 24년'처럼 나눌 수 있어요. 왼쪽 ⋮⋮ 손잡이를 끌어서 순서를 바꾸면 사이트에도 그 순서대로 나와요."
        fields:
          - { label: "소주제 제목 (한국어)", name: title_ko, widget: string }
          - { label: "소주제 제목 (영어)", name: title_en, widget: string, required: false }
          - { label: "부제 (한국어) — 예: 서울, 2026년 10월", name: note_ko, widget: string, required: false }
          - { label: "부제 (영어) — 예: Seoul, October 2026", name: note_en, widget: string, required: false }
          - { label: "설명 (한국어)", name: description_ko, widget: text, required: false }
          - { label: "설명 (영어)", name: description_en, widget: text, required: false }
          - { label: "이 소주제의 사진 배치 방식", name: layout, widget: select, default: "inherit", required: false, options: [{ label: "시리즈 설정 따르기", value: "inherit" }, { label: "세로로 크게 쌓기 (기본)", value: "stack" }, { label: "대표 컷 크게 + 아래 가로로 넘기기", value: "feature" }, { label: "사진 왼쪽 · 설명 오른쪽", value: "side-left" }, { label: "사진 오른쪽 · 설명 왼쪽", value: "side-right" }, { label: "사진 좌우 번갈아 · 옆에 설명", value: "alternate" }, { label: "옆으로 넘겨 보기 (가로로 끌기)", value: "scroll" }, { label: "격자로 모아 보기", value: "grid" }] }
          - label: "사진"
            name: photos
            widget: list
            allow_reorder: true
            collapsed: true
            label_singular: 사진
            summary: "{{fields.caption_ko}}"
            fields:
              - { label: "사진", name: image, widget: image }
              - { label: "캡션 (한국어)", name: caption_ko, widget: string, required: false }
              - { label: "캡션 (영어)", name: caption_en, widget: string, required: false }
              - { label: "사진 옆 설명 (한국어) — '옆 설명' 배치나 세로 쌓기에서 캡션 아래에 나와요", name: text_ko, widget: text, required: false }
              - { label: "사진 옆 설명 (영어)", name: text_en, widget: text, required: false }
      - label: "사진 (소주제 없이 쓰는 시리즈일 때만)"
        name: photos
        widget: list
        required: false
        allow_reorder: true
        collapsed: true
        label_singular: 사진
        summary: "{{fields.caption_ko}}"
        hint: "소주제를 쓰는 시리즈(예: 손의 이력)는 여기를 비워 두고, 사진은 위 소주제 안에 넣어요. 왼쪽 ⋮⋮ 손잡이를 끌어서 순서를 바꿀 수 있어요."
        fields:
          - { label: "사진", name: image, widget: image }
          - { label: "캡션 (한국어)", name: caption_ko, widget: string, required: false }
          - { label: "캡션 (영어)", name: caption_en, widget: string, required: false }
          - { label: "사진 옆 설명 (한국어) — '옆 설명' 배치나 세로 쌓기에서 캡션 아래에 나와요", name: text_ko, widget: text, required: false }
          - { label: "사진 옆 설명 (영어)", name: text_en, widget: text, required: false }
      - { label: "숨기기 (체크하면 사이트에 안 보여요)", name: draft, widget: boolean, default: false, required: false }

  - name: news
    label: 소식
    label_singular: 소식
    description: 수상, 전시, 기사, 출판 같은 소식을 올려요. 날짜가 최신인 소식이 위에 나와요.
    folder: content/news
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: title_ko
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{date}} · {{title_ko}}"
    sortable_fields: [date, title_ko]
    fields:
      - { label: "제목 (한국어)", name: title_ko, widget: string }
      - { label: "제목 (영어)", name: title_en, widget: string, required: false }
      - { label: "날짜", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "종류", name: category, widget: select, default: "news", options: [{ label: "수상", value: "award" }, { label: "전시", value: "exhibition" }, { label: "기사 · 인터뷰", value: "press" }, { label: "출판", value: "publication" }, { label: "소식", value: "news" }] }
      - { label: "대표 이미지 (선택)", name: image, widget: image, required: false }
      - { label: "짧은 소개 (한국어) — 목록에 보여요", name: summary_ko, widget: text, required: false }
      - { label: "짧은 소개 (영어)", name: summary_en, widget: text, required: false }
      - { label: "자세한 내용 (한국어) — 쓰면 소식을 눌렀을 때 따로 페이지가 열려요", name: body_ko, widget: text, required: false }
      - { label: "자세한 내용 (영어)", name: body_en, widget: text, required: false }
      - { label: "기사 · 원문 링크 (선택) — 예: https://news.example.com/…", name: link, widget: string, required: false }
      - { label: "숨기기 (체크하면 사이트에 안 보여요)", name: draft, widget: boolean, default: false, required: false }

  - name: settings
    label: 사이트 설정
    editor: { preview: false }
    files:
      - file: content/settings.json
        name: settings
        label: 사이트 설정
        fields:
          - { label: "사이트 이름 (왼쪽 위 로고)", name: site_title, widget: string }
          - { label: "첫 화면 문구 (한국어)", name: tagline_ko, widget: string, required: false }
          - { label: "첫 화면 문구 (영어)", name: tagline_en, widget: string, required: false }
          - label: "첫 화면 슬라이드 사진 (비우면 시리즈 대표 사진)"
            name: hero
            widget: list
            required: false
            allow_reorder: true
            collapsed: true
            label_singular: 슬라이드
            fields:
              - { label: "사진", name: image, widget: image }
              - { label: "캡션 (한국어)", name: caption_ko, widget: string, required: false }
              - { label: "캡션 (영어)", name: caption_en, widget: string, required: false }
          - { label: "소개 사진", name: about_image, widget: image, required: false }
          - { label: "소개 글 (한국어)", name: about_ko, widget: text, required: false }
          - { label: "소개 글 (영어)", name: about_en, widget: text, required: false }
          - { label: "연락 페이지 안내 글 (한국어)", name: contact_intro_ko, widget: text, required: false }
          - { label: "연락 페이지 안내 글 (영어)", name: contact_intro_en, widget: text, required: false }
          - { label: "이메일", name: email, widget: string, required: false }
          - { label: "연락 양식 키 (Web3Forms Access Key)", name: form_key, widget: string, required: false, hint: "web3forms.com 에서 이메일(wanddi@naver.com)을 넣으면 받는 키를 붙여 넣어요. 비워 두면 보내기 버튼이 메일 앱을 열어요." }
          - { label: "인스타그램 아이디", name: instagram, widget: string, required: false }
